[workspace]
name = "fit-the-camera"
version = "0.6.0"
description = "FTC – Fit The Camera: single-image camera calibration extension for Blender 5.2+"
authors = ["Antonio Sartini"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Python and numpy match the versions bundled with Blender 5.2.
[dependencies]
python = "3.13.*"
numpy = "2.3.*"
pytest = "*"
ruff = "*"

[tasks]
test = "pytest -q tests"
lint = "ruff check ."
format = "ruff format ."
# Headless Blender (downloaded into .tools/ by scripts/get_blender.sh).
blender-tests = "bash scripts/blender_tests.sh"
# Optional, needs a display (WSLg): drives the modal operator with simulated input.
gui-tests = "bash scripts/blender_gui_tests.sh"
validate = "bash scripts/blender.sh --command extension validate fit_the_camera"
build = "bash scripts/build.sh"
check = { depends-on = ["lint", "test", "validate", "blender-tests"] }
